<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bloopOrbFull" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="25%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bloopLeftWingFull" x1="0%" y1="30%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="25%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bloopRightWingFull" x1="0%" y1="85%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="20%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="veinArcFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Clean Off-White Warm Background matching 1794231088177.jpg -->
  <rect width="512" height="512" fill="#f6f7f2" />

  <!-- Emblem -->
  <g transform="translate(0, 0)">
    <!-- Top Sphere -->
    <circle cx="256" cy="148" r="27" fill="url(#bloopOrbFull)" />

    <!-- Left Leaf Wing -->
    <path d="M 250 248 C 250 192 201 120 154 126 C 146 188 181 243 250 248 Z" fill="url(#bloopLeftWingFull)" />
    <!-- Left Leaf Vein -->
    <path d="M 248 243 Q 205 208 174 142" fill="none" stroke="url(#veinArcFull)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Right Leaf Wing -->
    <path d="M 262 248 C 262 192 311 120 358 126 C 366 188 331 243 262 248 Z" fill="url(#bloopRightWingFull)" />
    <!-- Right Leaf Vein -->
    <path d="M 264 243 Q 307 208 338 142" fill="none" stroke="url(#veinArcFull)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Bold Modern Typography "BloopX" -->
  <text x="256" y="342" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="64" 
        letter-spacing="-1.8" 
        fill="#0b0e14">BloopX</text>
</svg>